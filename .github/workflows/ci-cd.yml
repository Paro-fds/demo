name: CI/CD Pipeline - Déploiement Proxmox Ubuntu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # Étape 1 : INTÉGRATION CONTINUE (CI)
  # ========================================================
  ci-tests-and-build:
    name: 🧪 Tests & Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Validation de syntaxe
        run: |
          python -m py_compile app.py test_app.py

      - name: 🧪 Exécuter les tests unitaires (Pytest)
        run: |
          pytest test_app.py -v

      - name: 🐳 Construction de l'image Docker
        run: |
          docker build -t villard-app:latest .

  # ========================================================
  # Étape 2 : DÉPLOIEMENT CONTINU (CD)
  # ========================================================
  cd-deploy-proxmox:
    name: 🚀 Déploiement vers Ubuntu (Proxmox VE)
    needs: ci-tests-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🔑 Configuration de la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROXMOX_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 Synchronisation des fichiers sur Ubuntu
        run: |
          rsync -avz --exclude='.git' --exclude='__pycache__' ./ ${{ secrets.PROXMOX_USER }}@${{ secrets.PROXMOX_HOST }}:/opt/villard-app/

      - name: 🚀 Lancement du conteneur sur l'instance Ubuntu
        run: |
          ssh ${{ secrets.PROXMOX_USER }}@${{ secrets.PROXMOX_HOST }} << 'EOF'
            cd /opt/villard-app
            docker compose down || true
            docker compose up -d --build
          EOF

      - name: 🩺 Test de bon fonctionnement (Smoke Test / Healthcheck)
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.PROXMOX_HOST }}:5000/)
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Déploiement réussi avec succès ! L'application répond HTTP 200."
          else
            echo "❌ Erreur de déploiement (Code HTTP: $STATUS)"
            exit 1
          fi
